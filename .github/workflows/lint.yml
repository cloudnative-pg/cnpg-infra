name: Lint

# Deliberately static-only, no GitHub API calls and no credentials of any
# kind -- see README's "Philosophy: laptop, not CI". This workflow only
# ever reads files already checked into the repo (YAML syntax, cross-file
# consistency against the last generated/*.yaml snapshot, and shell
# script linting). Anything that needs live org-admin access to GitHub
# stays laptop-only, run by hand via scripts/check-repo-settings.sh and
# friends.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Ruby syntax check
        run: |
          for f in scripts/*.rb; do
            ruby -c "$f"
          done

      - name: Validate YAML policy files
        run: ruby scripts/validate-policy.rb
