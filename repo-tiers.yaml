# Per-repo importance class, governance subproject, and GitHub description,
# all controlled centrally from this one file.
#
# Hand-maintained, like repo-policy.yaml, componentowners-policy.yaml, and
# org-policy.yaml — nothing regenerates this file. Unlike those three,
# every managed repo gets an entry here (not just exceptions), since every
# repo has *some* class, the same way every repo has *some* set of owners.
# check-repo-settings.sh flags any repo in managed-repos.yaml missing an
# entry here (see its "Configuration gaps" section) instead of silently
# defaulting, since that's exactly how klio went unclassified for a while.
#
# class drives the settings floor fix-repo-settings.sh enforces. Only
# required-reviews and code-owner-review actually change by class — the
# rest of the floor below (force-push/deletion blocked, linear history)
# already applied to every repo before this classification scheme existed,
# so it's listed for completeness, not because class changes it:
#
#           reviews   code-owner-review   force-push   deletion   linear
#   A         2            forced           blocked     blocked  required
#   B         1            forced           blocked     blocked  required
#   C         1          untouched          blocked     blocked  required
#
#   A  critical    Customer-facing runtime or deploy surface: the operator
#                  itself, the Helm charts users run to install/upgrade it,
#                  and the operand/extension images that actually run in
#                  production clusters. These are the repos that should
#                  progressively adopt every security standard first, since
#                  a problem here is immediately visible to every user.
#   B  important   Real consequences if wrong, but not itself the direct
#                  customer-facing surface: libraries the operator depends
#                  on (api, machinery, barman-cloud), the CNPG-I interface
#                  and its plugins, generated/automated supply-chain
#                  artifacts, public docs/website, CI/CD infra other repos
#                  depend on, an optional module some adopters run.
#   C  low-stakes  Templates, examples, internal test tooling, learning
#                  environments, explicitly experimental modules — not
#                  something adopted in production, or not yet proven
#                  enough to warrant a stricter floor.
#
# A repo also listed in repo-policy.yaml under category "automated" has
# its review-count and code-owner-review requirements skipped regardless
# of class — a bot publishing already-reviewed content can't satisfy a
# human PR-review gate the same way a person can. Class still governs
# everything else for that repo. `api` and `artifacts` are both automated
# (see repo-policy.yaml); `artifacts` is class A anyway (its generated YAML
# manifests are a direct deployment path for many users, not just an input
# to other tooling) even though "automated" already means class doesn't
# change its review-count/code-owner-review requirements today.
#
# subproject matches governance/subprojects/*.md's grouping. org-control
# is for repos that aren't part of any subproject and so have no class
# either — they're governed by the existing admins/steering-based model,
# not this scheme. `cnpg-template` is grouped here even though governance/
# subprojects/supply-chain.md currently still lists it under Supply Chain —
# it's the template every new org repo (including org-control ones) forks
# from, which makes it org tooling rather than a subproject deliverable;
# this is a real discrepancy with governance worth reconciling there, not
# something silently fixed by this file alone. "unclassified" means
# governance/subprojects/*.md doesn't document a subproject yet — a real
# gap, not an oversight here.
#
# description overrides the repo's GitHub description field.
# fix-repo-settings.sh pushes it via PATCH /repos/{owner}/{repo} whenever
# it differs from what's actually set; check-repo-settings.sh flags drift
# the same way it does for GitHub Pages config. Omit the field entirely to
# leave a repo's description alone (untouched, not blanked) — every value
# below was seeded from each repo's actual current description, so
# deploying this file for the first time changes nothing until you
# actually edit one.
#
# Fields:
#   name:        repo name, must match an entry in managed-repos.yaml
#   class:       A | B | C | n/a (org-control repos)
#   subproject:  core-projects | supply-chain | community-ecosystem |
#                extensibility | org-control | unclassified
#   reason:      why this class, when it's not obvious from the repo's own
#                description alone
#   description: desired GitHub repo description; omit to leave untouched

repositories:
  # --- org-control: outside this scheme entirely ---------------------------
  - name: .github
    class: n/a
    subproject: org-control
    description: "Org-wide GitHub configuration: profile page and default community health files."
  - name: .project
    class: n/a
    subproject: org-control
    description: "Project metadata for CloudNativePG - CNCF .project automation"
  - name: governance
    class: n/a
    subproject: org-control
    description: "CloudNativePG governance policies"
  - name: cnpg-infra
    class: n/a
    subproject: org-control
    description: "Local-first admin tooling for managing github.com/cloudnative-pg org settings, teams, and CODEOWNERS — run from an admin's laptop, never from CI"
  - name: cnpg-template
    class: n/a
    subproject: org-control
    reason: "The template every new org repo forks from — org tooling, not a subproject deliverable. NOTE: governance/subprojects/supply-chain.md still lists this under Supply Chain; this is a known discrepancy to reconcile there, not something this file resolves on its own."
    description: "A template repository for creating new CloudNativePG-related projects."

  # --- class A: critical (customer-facing runtime/deploy surface) ------------
  - name: cloudnative-pg
    class: A
    subproject: core-projects
    reason: "The operator itself — the most important repo in the org."
    description: "The most popular Kubernetes Operator for PostgreSQL."
  - name: charts
    class: A
    subproject: supply-chain
    reason: "How the operator and clusters actually get deployed — the literal command every user runs to install/upgrade, as directly customer-facing as the operator itself."
    description: "Official Helm charts for the operator, database clusters and the Barman Cloud plugin."
  - name: postgres-containers
    class: A
    subproject: supply-chain
    reason: "The PostgreSQL operand image running in every user's database pods."
    description: "Operand images for all community-supported PostgreSQL versions."
  - name: postgres-extensions-containers
    class: A
    subproject: supply-chain
    reason: "Extension images loaded directly into production databases."
    description: "Container images for community PostgreSQL extensions to be used as pluggable image volumes with CloudNativePG"
  - name: pgbouncer-containers
    class: A
    subproject: supply-chain
    reason: "Connection pooling image used in production."
    description: "Optimized images for PgBouncer connection pooling."
  - name: artifacts
    class: A
    subproject: supply-chain
    reason: "Generated YAML manifests are a direct deployment path for many users, not just an input to other tooling — at least as customer-facing as charts, per Gabriele. Also category: automated in repo-policy.yaml."
    description: "Storage for generated manifests, checksums, metadata, and image catalogs."

  # --- class B: important -----------------------------------------------------
  - name: api
    class: B
    subproject: core-projects
    reason: "The operator's own API types, split out for Go module reasons — a bug here breaks the operator's core contract, but this repo isn't itself customer-facing runtime."
    description: "The CloudNativePG API definitions and types."
  - name: machinery
    class: B
    subproject: core-projects
    reason: "Shared internal library consumed directly by the operator."
    description: "Common library extracted from CloudNativePG and containing functions and types shared by multiple projects"
  - name: barman-cloud
    class: B
    subproject: core-projects
    reason: "Backup/restore library — correctness bugs here risk data loss, but it's a library the operator depends on, not itself the customer-facing surface."
    description: "Go library for interacting with Barman Cloud object stores, used by the operator's native backup support."
  - name: cnpg-i
    class: B
    subproject: extensibility
    reason: "The CNPG-I interface spec itself — a breaking change here breaks every plugin that implements it, but it isn't itself deployed to a customer's cluster."
    description: "The CloudNativePG Interface (CNPG-I) gRPC specification."
  - name: plugin-barman-cloud
    class: B
    subproject: extensibility
    reason: "The reference backup/restore plugin — same data-safety stakes as barman-cloud, same reasoning for class B over A."
    description: "The reference CNPG-I backup/restore plugin for Barman Cloud."
  - name: klio
    class: B
    subproject: extensibility
    reason: "A backup and recovery solution compliant with CNPG-I — same data-safety stakes as plugin-barman-cloud, same reasoning for class B over A."
    description: "Multi-Tiered Backup and Recovery Plugin for CloudNativePG"
  - name: postgis-containers
    class: B
    subproject: supply-chain
    reason: "Per Gabriele — the way forward is PostGIS as a pluggable extension via postgres-extensions-containers, not this standalone bundled image, so it's moved off the critical customer-facing path."
    description: "PostgreSQL images bundled with PostGIS extensions."
  - name: daggerverse
    class: B
    subproject: supply-chain
    reason: "CI/CD infrastructure other repos' pipelines depend on."
    description: "Dagger modules for portable CI/CD workflows."
  - name: docs
    class: B
    subproject: community-ecosystem
    reason: "Public-facing documentation; already category: automated in repo-policy.yaml."
    description: "CloudNativePG operator documentation project"
  - name: cloudnative-pg.github.io
    class: B
    subproject: community-ecosystem
    reason: "The public project website."
    description: "CloudNativePG website"
  - name: grafana-dashboards
    class: B
    subproject: community-ecosystem
    reason: "Dashboards used to monitor production CNPG clusters, though not runtime code themselves."
    description: "Standardized Grafana dashboards for monitoring CNPG clusters."
  - name: cnpg-i-machinery
    class: B
    subproject: extensibility
    reason: "Shared Go code for CNPG-I plugins — a library, not the spec itself."
    description: "Shared Go code for developing CNPG-I compatible plugins."

  # --- class C: low-stakes ------------------------------------------------
  - name: postgres-trunk-containers
    class: C
    subproject: supply-chain
    reason: "Explicitly for early testing against PostgreSQL's development branch — not something anyone runs in production, unlike the other container-image repos."
    description: "Images built from PostgreSQL main branch for early testing."
  - name: ciclops
    class: C
    subproject: supply-chain
    reason: "CI reporting tool."
    description: "ciclops (CI-clops) is a GitHub Action that summarizes the result of a Test Suite executed in a series of \"strategy matrix\" branches, and helps orient investigations when tests fail."
  - name: github-test
    class: C
    subproject: supply-chain
    reason: "Literal playground for testing GitHub Actions."
    description: "Playground and testing ground for GitHub Actions and automation workflows."
  - name: cnpg-playground
    class: C
    subproject: community-ecosystem
    reason: "For learning purposes only, explicitly must not be used in production (see its own CLAUDE.md)."
    description: "Local learning environment for CloudNativePG using Docker and Kind."
  - name: webtest
    class: C
    subproject: community-ecosystem
    reason: "A PostgreSQL stress-testing tool, not customer-facing. NOTE: governance/subprojects/community-ecosystem.md describes this repo as \"Internal tooling for website and documentation testing\" — confirmed wrong by Gabriele; a real discrepancy worth fixing in governance, not resolved here."
    description: "A simple PostgreSQL stress tool"
  - name: cnpg-i-hello-world
    class: C
    subproject: extensibility
    reason: "Explicitly a template/example plugin."
    description: "A simplified template/example for building new plugins."
  - name: artwork
    class: C
    subproject: unclassified
    reason: "Logos/brand assets — no runtime impact. Also not yet reflected in any governance/subprojects/*.md listing (see top-level CLAUDE.md's note on this gap)."
    description: "Logos and brand assets for CloudNativePG."
  - name: chaos-testing
    class: C
    subproject: supply-chain
    reason: "Per Gabriele — moved from class B."
    description: "Chaos testing project to enhance CloudNativePG's resilience and fault tolerance"
  - name: postgres-keycloak-oauth-validator
    class: C
    subproject: extensibility
    reason: "Experimental — per Gabriele, moved from class B."
    description: "A PostgreSQL module for OAuth2/Keycloak token validation."
