        note: "Not in governance/subprojects/*.md — it's org-control infrastructure like governance/.project/.github, not a subproject deliverable (see governance/subprojects/README.md). The admins fallback was dropped once cnpg-infra-owners was confirmed to hold maintain here; admins keeps admin on this repo via org-policy.yaml regardless, which is what actually matters for a repo holding org-admin capability."
  - name: cnpg-playground
    rules:
