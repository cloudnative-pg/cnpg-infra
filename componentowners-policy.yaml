        note: "Steering/CNCF-owned control repo, not part of any subproject — no individual whole-repo owner documented beyond the maintainer committee itself. Same admins-fallback reasoning as .github; this is also what governance's own dev/67 CODEOWNERS does."
      - path: "/subprojects/core.md"
        teams: [core-maintainers]
        users: []
        note: "Real current CODEOWNERS scopes each subprojects/*.md file to its own subproject committee, per governance/subprojects/README.md and governance's own CLAUDE.md. subprojects/core.md exists on dev/67 (the core-projects.md rename is done). core-maintainers exists as a real GitHub team, granted write on this repo via repo-policy.yaml's extra_team_permissions, but its membership is still a placeholder mirroring admins, not a ratified roster (see org-policy.yaml's subproject_committees). The renderer prepends the `*` rule's governance-owners to this line, which is the fallback while that is true."
      - path: "/subprojects/supply-chain.md"
        teams: [supply-chain-maintainers]
        users: []
        note: "Same as core.md above — supply-chain-maintainers exists as a real team with placeholder membership."
      - path: "/subprojects/community-ecosystem.md"
        teams: [community-ecosystem-maintainers]
        users: []
        note: "Same as core.md above — community-ecosystem-maintainers exists as a real team with placeholder membership."
      - path: "/subprojects/extensibility.md"
        teams: [extensibility-maintainers]
        users: []
        note: "Same as core.md above — extensibility-maintainers exists as a real team with placeholder membership."
  - name: grafana-dashboards
