        note: "Newly added repo, not yet reflected in any governance/subprojects/*.md listing — no owner documented anywhere yet. Worth a routine editorial addition to the relevant subprojects file (see subprojects/README.md — no vote needed for that). jlong49 (John Long) is deliberately an individual CODEOWNERS reviewer here, not a klio-owners team member — per Gabriele, he should be able to review but isn't (yet) an owner. He holds a direct 'write' collaborator grant on the repo (not tracked by repo-tiers.yaml's owners:/sync-project-owner-teams.sh, since that only manages the owners team) so GitHub actually honors him as a code owner — CODEOWNERS silently drops anyone without write+ access."
