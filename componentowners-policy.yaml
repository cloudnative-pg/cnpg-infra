        teams: [chaos-testing-owners]
        users: []
  - name: charts
    rules:
      - path: "*"
        teams: [charts-owners]
        users: []
      - path: "/charts/cluster/"
        teams: []
        users: [itay-grudev, phisco]
  - name: ciclops
