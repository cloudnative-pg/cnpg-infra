      - path: "*"
        teams: [cloudnative-pg-owners]
        users: []
        note: "No whole-repo owner beyond the maintainer committee documented in governance/subprojects/core-projects.md — only the three path-scoped rows below are documented."
      - path: "/docs/"
        teams: []
        users: [jsilvela]
      - path: "/config/olm-*/"
        teams: []
        users: [NiccoloFei]
      - path: "/.github/ /hack/ /tests/"
        teams: []
        users: [NiccoloFei, litaocdl, jsilvela]
        note: "Governance documents this as one combined 'Testing' scope covering all three paths, not three separate rows; split into three CODEOWNERS lines with identical owners when generating the real file."
  - name: cloudnative-pg.github.io
