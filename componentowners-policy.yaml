        note: "Org-control repo (moved out of Supply Chain by governance's dev/67, see governance/subprojects/README.md). Its live CODEOWNERS still named the deleted org-wide `maintainers` team, so every PR here had an unknown code owner until this was rendered and landed. Same admins-fallback reasoning as .github."
  - name: daggerverse
    rules:
      - path: "*"
        teams: [daggerverse-owners]
        users: []
  - name: docs
