# Desired-state CODEOWNERS content for every managed repo (see
# managed-repos.yaml) — the single source of truth this workspace uses to
# check and (in a later step) fix each repo's actual CODEOWNERS file
# against. Renamed from codeowners-policy.yaml once it grew from "just the
# `*` rule" to the full set of rules a repo's CODEOWNERS file needs,
# including path-scoped ones.
#
# Hand-maintained — like repo-policy.yaml and org-policy.yaml, nothing
# regenerates this file.
#
# Each repo has an ordered list of `rules`, one per CODEOWNERS line:
#   path:  the CODEOWNERS pattern. "*" is the catch-all default-owners
#          line; anything else (e.g. "/docs/", "/timescaledb-oss/") is a
#          path-scoped override, matching that repo's own directory
#          layout. Order matters the same way it does in a real CODEOWNERS
#          file: later, more specific patterns override earlier ones for
#          the paths they match, so keep "*" first.
#   teams: team slugs for this line (rendered as `@cloudnative-pg/<slug>`)
#   users: individual GitHub usernames for this line (rendered as `@<user>`)
#
# Prefer a team over hardcoding individual users wherever one already
# fits: a team's membership changes get picked up automatically, a
# hardcoded user list doesn't. Every repo's `*` rule below follows this by
# using its own `<repo>-owners` team rather than naming its owners
# individually; `users` on a rule is for a genuine path-scoped exception
# (see the path-scoped rules further down), not a repo-wide default.
#
# Sourced from governance/subprojects/*.md's Scope + Owners columns
# (whole-repository AND path-scoped rows both included here, unlike the
# old codeowners-policy.yaml which only tracked the whole-repo row).
# Every `*` rule names the repo's own `<repo>-owners` team. The org-control
# repos (.github, .project, cnpg-infra, cnpg-template, governance) add
# `admins` after it, because they carry real org-administration capability
# and have no subproject committee of their own; every other repo lists its
# owners team alone. repo-tiers.yaml's `owners` field is what actually
# populates each `<repo>-owners` team's membership — this file only
# references the team by name.
#
# Governance's proposed subproject committees (core-maintainers,
# supply-chain-maintainers, etc., see governance/subprojects/README.md) now
# exist as real GitHub teams, but with placeholder membership pending
# ratification, so they are referenced only by the governance repo's
# path-scoped rules — not as a broad-access fallback on any `*` rule.
#
# note: present on a rule where governance documents no owner at all for
# that scope — a real, flagged gap, not an oversight in this file.
#
# Every managed repo gets a `*` rule now, including the org-control ones
# (.github, .project, cnpg-infra) — no more no-owner exceptions. .github
# and .project used to have none at all (only the 7 org owners could
# administer them); now each gets its own <repo>-owners team like every
# other repo, falling back to admins. Revisit the fallback once the
# steering-committee team (planned to own governance/.project/.github,
# see governance/subprojects/README.md) is rolled out.

repositories:
  - name: .github
    rules:
      - path: "*"
        teams: [github-owners]
        users: []
        note: "Org-control repo with no subproject committee of its own. The admins fallback was dropped once github-owners was confirmed to hold maintain here: admins already has admin on every repo via org-policy.yaml's global_admin_teams, so listing it as a code owner only added noise to review requests. Same reasoning across all five org-control repos, matching governance's dev/67 CODEOWNERS."
  - name: .project
    rules:
      - path: "*"
        teams: [project-owners]
        users: []
        note: "Same reasoning as .github."

  - name: api
