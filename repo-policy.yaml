# Repo-specific exceptions to the org-wide settings baseline.
#
# Hand-maintained — unlike managed-repos.yaml, this file is NOT regenerated
# by any script. It's the place to record *why* a given repo intentionally
# deviates from the default baseline that check-repo-settings.sh audits and
# fix-repo-settings.sh enforces, so the reasoning survives even if the
# person who made the call isn't around to ask.
#
# Adding a repo here is an operational call about that one repo's settings,
# not a governance decision (see governance/CLAUDE.md) — no vote needed,
# just a clear reason recorded below.
#
# Categories:
#
#   automated
#     The repo's default-branch content is machine-published from another
#     repo where it was already authored and reviewed — there is no
#     independent human authorship happening in *this* repo, so requiring
#     PR review here is redundant with the review that already happened
#     upstream. fix-repo-settings.sh does not force a required-reviews floor
#     on repos in this category (it leaves required_pull_request_reviews as
#     whatever it currently is, instead of raising it to >=1); it still
#     blocks force-push/deletion on the default branch and still enables
#     the security features (secret scanning, Dependabot), since those are
#     unrelated to the review-gate question. check-repo-settings.sh marks
#     these repos so a missing PR-review requirement doesn't read as a gap
#     in the audit report.
#
# required_reviews (optional, integer)
#   A standalone floor override, kept for a repo that needs one before (or
#   instead of) being classified in repo-tiers.yaml. Most repos get their
#   review-count floor from repo-tiers.yaml's class instead (A = 2, B/C =
#   1); fix-repo-settings.sh takes the higher of the two wherever both are
#   present, and — as always — never lowers an existing stricter value
#   below either. Not currently used by any repo — every repo that needs a
#   higher floor is already classified in repo-tiers.yaml.
#
# immutable_releases (optional, false — the only accepted value)
#   Opts a repo OUT of release immutability, which fix-repo-settings.sh
#   otherwise enables by default on every repo (published releases and
#   their tags become undeletable/unmodifiable by anyone, including
#   admins — a GitHub setting, not a ruleset). This is the reverse polarity
#   from every other field here: everything else is opt-in to an
#   exception, this one is opt-out of a default-on floor, because
#   immutability is a pure hardening with no real downside for a repo that
#   publishes releases normally, and a no-op for one that has none. Once
#   set, fix-repo-settings.sh leaves the repo's actual setting alone
#   (never forces it back on) rather than fighting a deliberate exception.
#   Used by cloudnative-pg, charts, klio, plugin-barman-cloud, and
#   grafana-dashboards — each one's release automation overwrites or
#   recreates a release/tag as part of its normal process, which
#   immutability would break. GitHub's API for this setting has no
#   per-team bypass (unlike ruleset bypass_actors) — it is a plain
#   per-repo on/off toggle, so this field is the only exception lever
#   available at all.
#
# squash_merge_message (optional, PR_BODY | COMMIT_MESSAGES)
#   Overrides the org default of PR_BODY for squash_merge_commit_message
#   (what populates the commit message body when a PR is squash-merged).
#   PR_BODY uses the pull request's own description; COMMIT_MESSAGES
#   concatenates the individual commit messages from the branch instead.
#   Not yet used by any repo — documented here so the mechanism exists when
#   one is needed; every repo currently gets the PR_BODY default via
#   fix-repo-settings.sh regardless of whether it's listed below.
#
# ruleset_bypass_teams (optional, list of team slugs)
#   Teams that should be able to bypass the main-branch ruleset entirely —
#   push directly to the default branch, and merge PRs with none of the
#   ruleset's requirements satisfied (no approving reviews, no passing
#   status checks). fix-repo-settings.sh adds each listed team to the
#   ruleset's bypass_actors with bypass_mode "always" (not "pull_request",
#   which would still force changes through a PR, just without needing
#   review/checks — these repos need actual direct-push automation, e.g. a
#   release bot bumping versions/tags or publishing generated content).
#   Only ever adds bypass actors, never removes one that's already there
#   for some other reason. `bots` is the only team used here today — this
#   grants it a genuine "no gate at all" exception on top of the plain
#   `maintain` permission org-policy.yaml's global_maintain_teams already
#   gives it on every repo, so use it only where direct-push automation
#   actually runs, not as a substitute for the org-wide grant.
#
# pages_* (optional — enabled, build_type, branch, path, cname)
#   Documents the expected GitHub Pages configuration for a repo that
#   serves one, so check-repo-settings.sh can flag drift (Pages disabled,
#   or serving from the wrong branch/build type) instead of a silently
#   broken cloudnative-pg.io. Values below reflect each repo's actual,
#   working configuration at the time this was written — not an assumed
#   default — since Pages setup varies too much per repo (build_type,
#   source branch, custom domain) to have one. fix-repo-settings.sh does
#   NOT enforce or auto-create Pages config from this today (see its
#   header comment) — getting Pages wrong can take a production site
#   down, so that's deliberately left to a human, at least for now.
#     pages_enabled:    true | false
#     pages_build_type: workflow (deployed by a GitHub Actions workflow,
#                       e.g. actions/deploy-pages) | legacy (deployed by
#                       pushing pre-built content to a branch GitHub serves
#                       directly, e.g. peaceiris/actions-gh-pages)
#     pages_branch:     source branch Pages serves from
#     pages_path:       source path within that branch (almost always "/")
#     pages_cname:      custom domain, if any (omit the field if none)
#
# Fields:
#   name:                 repo name, must match an entry in managed-repos.yaml
#   category:             automated (only category defined so far)
#   reason:               why this repo has an exception — single line, no
#                         folded blocks, so the simple awk/grep parsing in
#                         the scripts stays reliable
#   upstream:             org/repo this one re-publishes from, if applicable
#                         (only meaningful for category: automated)
#   required_reviews:     integer floor for required approving reviews, if
#                         higher than the org default of 1
#   squash_merge_message: PR_BODY (org default, so unused today) |
#                         COMMIT_MESSAGES
#   ruleset_bypass_teams: see above
#   immutable_releases:   see above (only meaningful value is `false`)
#   pages_*:              see above

repositories:
  - name: docs
    category: automated
    reason: "Publishes documentation content already authored and reviewed in cloudnative-pg/cloudnative-pg (docs/); this repo only auto-publishes it, so a mandatory PR-review gate here would be redundant, not a real second review."
    upstream: cloudnative-pg/cloudnative-pg
    ruleset_bypass_teams: [bots]
    pages_enabled: true
    pages_build_type: workflow
    pages_branch: main
    pages_path: /
  - name: cnpg-infra
    reason: "Per Gabriele: this project is experimental — push directly to main, no PRs, until told otherwise. The main ruleset still blocks force-push/deletion and requires linear history, but admins bypasses the PR-review requirement entirely so direct pushes keep working."
    ruleset_bypass_teams: [admins]
  - name: api
    category: automated
    reason: "Per Gabriele: repo content is machine-published, not authored PR-by-PR here — synced from cloudnative-pg/cloudnative-pg's own api/v1/ (the types are \"split out for Go module reasons\" per that repo's CLAUDE.md)."
    upstream: cloudnative-pg/cloudnative-pg
    ruleset_bypass_teams: [bots]
  - name: artifacts
    category: automated
    reason: "Generated manifests/checksums/catalogs are published by automation, not authored PR-by-PR; see repo-tiers.yaml for why this repo is nonetheless class A."
    ruleset_bypass_teams: [bots]
  - name: plugin-barman-cloud
    reason: "Pages config, plus opted out of release immutability — its release automation overwrites/recreates tags or releases, which immutability would break; review requirements come from repo-tiers.yaml's class instead of a standalone override here."
    pages_enabled: true
    pages_build_type: workflow
    pages_branch: main
    pages_path: /
    immutable_releases: false
  - name: cloudnative-pg.github.io
    reason: "The cloudnative-pg.io landing site — served via legacy (branch-based) Pages from gh-pages, built by hugo_build.yml using peaceiris/actions-gh-pages, unlike docs/ and plugin-barman-cloud which use the newer Actions-workflow Pages build type."
    pages_enabled: true
    pages_build_type: legacy
    pages_branch: gh-pages
    pages_path: /
    pages_cname: cloudnative-pg.io
  - name: postgres-containers
    reason: "Release automation (version bumps, tagging) needs to push directly to main and merge without waiting on human review."
    ruleset_bypass_teams: [bots]
  - name: pgbouncer-containers
    reason: "Release automation (version bumps, tagging) needs to push directly to main and merge without waiting on human review."
    ruleset_bypass_teams: [bots]
  - name: postgis-containers
    reason: "Release automation (version bumps, tagging) needs to push directly to main and merge without waiting on human review."
    ruleset_bypass_teams: [bots]
  - name: postgres-trunk-containers
    reason: "Release automation (version bumps, tagging) needs to push directly to main and merge without waiting on human review."
    ruleset_bypass_teams: [bots]
  - name: postgres-extensions-containers
    reason: "Release automation (version bumps, tagging) needs to push directly to main and merge without waiting on human review."
    ruleset_bypass_teams: [bots]
  - name: charts
    reason: "Chart release automation (version bumps, packaging) needs to push directly to main and merge without waiting on human review; also opted out of release immutability since that same automation overwrites/recreates release tags."
    ruleset_bypass_teams: [bots]
    immutable_releases: false
  - name: klio
    reason: "Release automation overwrites/recreates tags or releases as part of its normal process; release immutability would break that."
    immutable_releases: false
  - name: cloudnative-pg
    reason: "Release automation overwrites/recreates tags or releases as part of its normal process; release immutability would break that."
    immutable_releases: false
  - name: grafana-dashboards
    reason: "Release automation overwrites/recreates tags or releases as part of its normal process; release immutability would break that."
    immutable_releases: false
