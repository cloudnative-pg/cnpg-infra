# Per-repo exceptions to the gitvote configuration baseline.
#
# Hand-maintained, like repo-policy.yaml -- not regenerated by anything.
# Every repo in managed-repos.yaml gets a rendered .gitvote.yml whether or
# not it's listed here; this file only needs an entry for a repo that
# should deviate from the default template below.
#
# gitvote itself (the cncf/gitvote GitHub App) is already installed
# org-wide with repository_selection: "all" -- every current and future
# managed repo already has it, so there is no per-repo "install" step for
# check-gitvote-config.sh or fix-gitvote-config.sh to manage. The only
# thing either script touches is each repo's own .gitvote.yml content.
#
# Default template (applies to any repo NOT listed below):
#   Two profiles, both scoped to that repo's own "<repo>-owners" GitHub
#   team (repo-tiers.yaml's `owners` field is what populates it; see
#   sync-project-owner-teams.sh), mirroring CONTRIBUTOR_LADDER.md's two
#   repository-level thresholds:
#     - default:         pass_threshold 50.01 (simple majority) -- Contributor
#                         promotion/removal
#     - component-owner: pass_threshold 66.66 (two-thirds) -- Component Owner
#                         promotion/removal
#   The thresholds are fractional on purpose: gitvote passes a vote on
#   `in_favor_percentage >= pass_threshold`, so a flat 50 lets an
#   even-sized electorate tie 2-2 and still pass, and a flat 66 sits just
#   under a true two-thirds. See render-gitvote-config.sh for the math.
#   Rendered in full by scripts/check-gitvote-config.sh and
#   scripts/fix-gitvote-config.sh; see either script for the exact content.
#
# Categories:
#
#   org-control
#     One of the five repos with no subproject of its own (governance,
#     .project, .github, cnpg-infra, cnpg-template) -- Steering Committee
#     business, not a subproject's. Rendered template scopes both profiles
#     (default, steering) to the `steering-committee` team instead of a
#     repo-owners team. Every managed repo in this category needs an entry
#     here; there's no other way to mark a repo as org-control.
#
# excluded (optional, true -- the only accepted value)
#   Neither script touches this repo at all, including check-gitvote-
#   config.sh's diff output (it's still listed in the report, marked
#   excluded, so the audit stays a complete inventory). Used for a repo
#   whose .gitvote.yml is deliberately maintained outside this workflow.
#   Today that's only `governance` itself: its allowed_voters fix already
#   landed as its own small PR (branch dev/fix-gitvote-governance-scope in
#   the governance repo), and it now matches this file's org-control
#   template anyway (steering-committee) -- excluded is about ownership of
#   the file going forward, not about it currently drifting.
#
# allowed_voters_teams (optional, list of team slugs)
#   Overrides the default template's voter team(s) for one repo, without
#   changing its category. Not currently used by any repo -- every repo
#   that needs non-default voters is already covered by the org-control
#   category instead.
#
# Fields:
#   name:                 repo name, must match an entry in managed-repos.yaml
#   category:             org-control (only category defined so far)
#   reason:                why this repo has an exception -- single line, no
#                         folded blocks, so the simple awk/grep parsing in
#                         the scripts stays reliable
#   excluded:             true (see above)
#   allowed_voters_teams: list of team slugs, see above

repositories:
  - name: .github
    category: org-control
    reason: "One of the five org-control repos with no subproject of its own -- Steering Committee business."
  - name: .project
    category: org-control
    reason: "Same as .github -- org-control, no subproject of its own."
  - name: cnpg-infra
    category: org-control
    reason: "Same as .github -- org-control, no subproject of its own. Also this repo's own bypass exception (see repo-policy.yaml, CLAUDE.md) means fix-gitvote-config.sh pushes directly to main here instead of opening a PR."
  - name: cnpg-template
    category: org-control
    reason: "Same as .github -- org-control, no subproject of its own."
  - name: governance
    category: org-control
    excluded: true
    reason: "Its .gitvote.yml is maintained directly in that repo, not rendered from here, and has outgrown the org-control template: the federated governance model adds a profile per subproject committee plus a -removal variant of each, and an automation rule that opens a two-thirds Steering vote on any PR touching GOVERNANCE.md or CONTRIBUTOR_LADDER.md. Listed here (rather than left out of this file) so the audit report still accounts for all five org-control repos, and so a future contributor doesn't add a bespoke entry for it by mistake."
