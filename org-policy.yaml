# Org-wide access policy — settings that apply identically across every
# managed repo (see managed-repos.yaml), rather than being configured
# per-repo. Hand-maintained, like repo-policy.yaml and codeowners-policy.yaml
# — nothing regenerates this file.
#
# Deliberately separate from those two per-repo files: a rule that should
# hold for every single repo belongs here once, not repeated 31 times
# across per-repo entries. If a setting only applies to *some* repos, or
# needs a repo-specific reason, it belongs in repo-policy.yaml or
# codeowners-policy.yaml instead, not here.
#
# global_admin_teams / global_maintain_teams
#   Teams that should have at least `admin` (or at least `maintain`)
#   permission on every managed repo, without needing to be listed in
#   that repo's own CODEOWNERS or repo-policy.yaml entry.
#   fix-repo-settings.sh grants/verifies this org-wide — a repo's own
#   config files never need to mention these teams at all.
#
#   Deliberately a repo permission grant, not a CODEOWNERS entry: these
#   teams aren't meant to gate PR review/approval (that's what a repo's
#   own componentowners-policy.yaml rules and repo-tiers.yaml `owners`
#   are for) — they need operational access to the repo itself, e.g.
#   `bots` (the cnpg-bot automation account) pushing tags or publishing
#   releases.
#
#   Enforcement only ever raises: if a team already holds a stricter
#   permission than the one listed here for a given repo (e.g. `bots`
#   already has `admin` on a few container-image repos, ahead of the
#   `maintain` floor below), that grant is left alone, never downgraded.
#
# Adding or removing a team here is an operational call, same as
# repo-policy.yaml entries — not a governance decision requiring a vote
# (see governance/CLAUDE.md) — but changing who has org-wide admin or
# maintain access on every repo is high-impact, so treat this file's
# edits with more care than a routine repo-policy.yaml addition.

global_admin_teams:
  - admins

global_maintain_teams:
  - bots

# base_repository_permission
#   The org's "base permissions" (GitHub API field: default_repository_permission)
#   — what a plain org member (someone with no elevated org role and on no
#   team granted access to a given repo) gets on every repo by default.
#   Should be `read`, not `write`: any access beyond read must come from an
#   explicit grant — org-wide (global_admin_teams/global_maintain_teams
#   above), a `<repo>-owners` team (repo-tiers.yaml), or a documented
#   per-repo exception (repo-policy.yaml) — never from merely being an org
#   member.
#
#   Unlike global_admin_teams/global_maintain_teams, this is a
#   documentation-only entry: it's an org-level setting (Settings ->
#   Member privileges -> Base permissions on github.com/orgs/cloudnative-pg),
#   not a per-repo one, so fix-repo-settings.sh has no lever for it —
#   check-repo-settings.sh audits it (see its "Default repository
#   permission for members" report line) but nothing here changes it.
#   Confirmed live on GitHub as `read` as of this writing (see
#   repo-settings-report.md). If a future audit ever shows `write`, that's
#   a real org-level setting to change by hand (Organization settings, not
#   a script), not something any script in this repo will fix for you.
base_repository_permission: read

# subproject_committees
#   The 4 subproject maintainer committees of governance's federated model
#   (CNCF incubation restructuring, cloudnative-pg/governance's dev/67
#   branch: a Steering Committee separate from per-subproject maintainer
#   committees — Core, Supply Chain, Community/Docs & Ecosystem,
#   Extensibility). These are no longer placeholders: dev/67 gives all four
#   a real roster in governance/MAINTAINERS.md, and all four are seeded
#   with the same 5 people, the maintainers as they stood before the
#   restructuring, since that is who held the authority being divided up.
#   Expected to diverge as Component Owners are promoted into them, which
#   is when this list stops being five identical blocks. Each committee has
#   a floor of 3 members; below that, Steering is caretaker for that
#   subproject (see governance/GOVERNANCE.md).
#
#   Unlike repo-tiers.yaml's `owners` field, there is no sync script for
#   this yet — editing this list does not by itself change GitHub team
#   membership. Whoever updates this file also needs to reconcile the
#   corresponding GitHub team by hand (or ask for the sync tooling to be
#   extended to cover this, the way sync-project-owner-teams.sh does for
#   the `<repo>-owners` teams).
#
#   Repo access: each of the 4 is granted `write` on the `governance` repo
#   via repo-policy.yaml's extra_team_permissions, without which GitHub
#   ignores the CODEOWNERS lines that reference them. The `Maintain` grant
#   on each subproject's own repositories, which governance's
#   subprojects/README.md describes as the target, is not in place yet.
subproject_committees:
  core-maintainers:
    - armru
    - fcanovai
    - gbartolini
    - leonardoce
    - mnencia
  supply-chain-maintainers:
    - armru
    - fcanovai
    - gbartolini
    - leonardoce
    - mnencia
  community-ecosystem-maintainers:
    - armru
    - fcanovai
    - gbartolini
    - leonardoce
    - mnencia
  extensibility-maintainers:
    - armru
    - fcanovai
    - gbartolini
    - leonardoce
    - mnencia

# steering_committee
#   The real GitHub team gitvote and repo access now scope Steering
#   Committee business to (created 2026-09-08), unlike the 4 placeholder
#   committees above. Same caveat still applies: it's not yet ratified
#   or elected per governance's dev/67 + dev/70 draft, so membership below
#   is today's 5 core maintainers, not a final roster. Same sync gap as
#   subproject_committees too: no script reconciles this list against the
#   live team yet, so a change here needs a matching `gh api` call by
#   hand until that's automated.
steering_committee:
  - armru
  - fcanovai
  - gbartolini
  - leonardoce
  - mnencia
